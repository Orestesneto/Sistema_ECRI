<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirmação de recebimento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <main class="container py-4" style="max-width:720px">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-2">Confirmação de recebimento</h1>
                <p class="text-muted">Confira os materiais e confirme sua identidade para assinar digitalmente.</p>
                <div id="alertaAceite" class="alert" style="display:none" role="alert"></div>
                <section id="resumoAceite" aria-live="polite"><div class="text-center py-4">Carregando protocolo...</div></section>
                <form id="formAceiteAlmoxarifado" class="mt-4" style="display:none">
                    <hr>
                    <h2 class="h5">Confirme seu login</h2>
                    <div class="mb-3">
                        <label for="cpfAceite" class="form-label">CPF</label>
                        <input id="cpfAceite" class="form-control" inputmode="numeric" autocomplete="username" maxlength="14" required>
                    </div>
                    <div class="mb-3">
                        <label for="nascimentoAceite" class="form-label">Data de nascimento</label>
                        <input id="nascimentoAceite" type="password" class="form-control" inputmode="numeric" autocomplete="current-password" maxlength="10" placeholder="DDMMAAAA" required>
                    </div>
                    <div class="form-check mb-3">
                        <input id="confirmacaoMateriais" class="form-check-input" type="checkbox" required>
                        <label for="confirmacaoMateriais" class="form-check-label">Confirmo que recebi os materiais e quantidades relacionados acima.</label>
                    </div>
                    <button id="btnAssinarAceite" class="btn btn-primary w-100" type="submit">Assinar e confirmar recebimento</button>
                </form>
            </div>
        </div>
    </main>
    <script src="js/aceite-almoxarifado.js"></script>
</body>
</html>
